
name: Terraform CD - Reviewed Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Plan, validate and review
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      has_changes: ${{ steps.plan_status.outputs.has_changes }}
      reviewed_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Record reviewed commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pytest python-dotenv google-genai

      - name: Run automated tests
        run: python -m pytest -v

      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          response=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          token=$(printf '%s' "$response" | python -c \
            'import json,sys; print(json.load(sys.stdin)["value"])')

          TOKEN="$token" python - <<'PY'
          import os
          import json
          import base64

          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("sub", "aud", "repository", "ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure read-only planning credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::960946313156:role/GitHubActionsVPCPlanRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        run: terraform init

      - name: Validate Terraform
        run: terraform validate

      - name: Run deterministic checks and mandatory Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python approval_gate.py --review-only

      - name: Verify reviewed plan exists
        shell: bash
        run: |
          if [ ! -f tfplan ]; then
            echo "::error::The review step did not create tfplan."
            echo "Update approval_gate.py or the review command to generate the saved plan before continuing."
            exit 1
          fi

      - name: Determine whether the reviewed plan changes infrastructure
        id: plan_status
        shell: bash
        run: |
          terraform show -json tfplan > plan.json

          python - <<'PY'
          import json
          import os

          with open("plan.json", encoding="utf-8") as file:
              plan = json.load(file)

          changes = plan.get("resource_changes") or []
          has_changes = any(
              item.get("change", {}).get("actions", []) != ["no-op"]
              for item in changes
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_changes={str(has_changes).lower()}\n")

          print(f"Infrastructure changes detected: {has_changes}")
          PY

      - name: Record reviewed plan checksum
        if: steps.plan_status.outputs.has_changes == 'true'
        run: sha256sum tfplan > tfplan.sha256

      - name: Upload reviewed plan
        if: steps.plan_status.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-terraform-plan
          path: |
            tfplan
            tfplan.sha256
          retention-days: 1
          if-no-files-found: error

      - name: Report no changes
        if: steps.plan_status.outputs.has_changes == 'false'
        run: echo "Review passed. No infrastructure changes; deployment is skipped."

  apply:
    name: Apply approved plan
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment: production

    steps:
      - name: Checkout the exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.reviewed_sha }}

      - name: Verify checked-out commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.plan.outputs.reviewed_sha }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::960946313156:role/GitHubActionsVPCProvisioningRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: reviewed-terraform-plan
          path: .

      - name: Verify reviewed plan integrity
        run: sha256sum --check tfplan.sha256

      - name: Initialize Terraform
        run: terraform init

      - name: Apply the exact reviewed plan
        run: terraform apply -input=false tfplan
